# Default rule set shipped with the binary. Weights are contributions to a
# score in [0,1]; image evidence is deliberately weighted most heavily.
version: "1.0"

severities:
  red: 0.45
  risk: 0.20
  green: 0.0

risk_bands:
  caution: 0.30
  elevated: 0.55
  high: 0.75

rules:
  payment_no_recourse:
    type: pattern_match
    description: "Payment requested by a method with no recourse"
    scope: whole_post
    severity: red
    hard: true
    match: {preset: payment_no_recourse}
  urgency_pressure:
    type: pattern_match
    description: "High-pressure language discouraging due diligence"
    scope: whole_post
    severity: risk
    match: {preset: urgency_pressure}
  absentee_landlord:
    type: pattern_match
    description: "Owner claims to be unreachable in person"
    scope: whole_post
    severity: red
    match: {preset: absentee_landlord}
  contact_evasion_phrases:
    type: pattern_match
    description: "Seller steering away from a verifiable channel"
    scope: whole_post
    severity: risk
    match: {preset: contact_evasion_phrases}
  deposit_before_viewing:
    type: pattern_match
    description: "Money requested before the renter has seen the property"
    scope: whole_post
    severity: red
    match: {preset: deposit_before_viewing}
  prepayment_before_access:
    type: pattern_match
    description: "Payment requested before a tour, keys, or physical access"
    scope: whole_post
    severity: risk
    match: {preset: prepayment_before_access}
  obfuscated_contact:
    type: contact_check
    description: "Contact details written to evade detection"
    scope: whole_post
    severity: risk
    checks: [obfuscated_digits, spelled_out_digits, email_obfuscation]
  relay_only_contact:
    type: contact_check
    description: "Seller reachable only through the marketplace"
    scope: whole_post
    severity: risk
    checks: [relay_only, app_only]
  direct_phone_listed:
    type: contact_check
    description: "Direct phone number provided"
    scope: whole_post
    severity: green
    checks: [direct_phone_present]
  nonstandard_rental_fee:
    type: application_fee_check
    description: "Nonstandard hold or reservation fee"
    scope: whole_post
    severity: risk
    fee_check_kind: nonstandard
  high_standard_rental_fee:
    type: application_fee_check
    description: "Unusually high standard rental fee"
    scope: whole_post
    severity: risk
    fee_check_kind: high_standard
    application_fee_high_threshold: 50
  market_rent_below_hud:
    type: market_rent_check
    description: "Listed monthly rent is far below the local HUD benchmark"
    severity: risk
    weight: 0.15
    market_rent_low_ratio: 0.55
  rent_price_mismatch:
    type: rent_price_mismatch
    description: "Advertised rent conflicts with the page price"
    severity: risk
    weight: 0.15
    rent_price_mismatch_ratio: 0.10
  reverse_image_real_estate:
    type: image_analysis
    description: "Listing photo also appears on a real-estate site"
    method: reverse_search
    severity: red
    hard: true
    weight: 0.60
    flags_matching: [zillow, redfin, realtor, trulia, mls]
  stock_photos:
    type: image_analysis
    description: "Listing photo is a stock image"
    method: reverse_search
    severity: risk
    weight: 0.35
    flags_matching: [shutterstock, istockphoto, unsplash, gettyimages, pexels]
  mls_watermark:
    type: image_analysis
    description: "Listing photo carries an agency or MLS watermark"
    method: ocr
    severity: red
    hard: true
    weight: 0.30
    text_matching: ["multiple listing service", "mls", "zillow", "redfin", "coldwell", "century 21"]
