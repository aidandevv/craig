name: Verify

on:
  pull_request:
  push:
    branches: [main, release/web-extension]

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          check-latest: true
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o /tmp/craig-extension ./cmd/craig-extension
      - name: Scan known Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  extension:
    name: Extension checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Build engine.wasm
        working-directory: .
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          mkdir -p extension/generated
          go build -trimpath -ldflags="-s -w" -o extension/generated/engine.wasm ./cmd/craig-wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" extension/generated/wasm_exec.js
          ls -lh extension/generated/engine.wasm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

  wasm:
    name: WebAssembly core builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Build shared engine for js/wasm
        env:
          GOOS: js
          GOARCH: wasm
        run: go build ./internal/engine/...
      - name: Engine must not pull in SQLite
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          if go list -deps ./internal/engine | grep -E 'modernc.org/sqlite|internal/cache|internal/daemon|internal/config'; then
            echo "engine depends on a daemon-only package" >&2; exit 1
          fi
