name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o /tmp/craig-extension ./cmd/craig-extension
      - name: Scan known Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  extension:
    name: Extension checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  wasm:
    name: WebAssembly core builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Build shared engine for js/wasm
        env:
          GOOS: js
          GOARCH: wasm
        run: go build ./internal/engine/...
      - name: Engine must not pull in SQLite
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          if go list -deps ./internal/engine | grep -E 'modernc.org/sqlite|internal/cache|internal/daemon|internal/config'; then
            echo "engine depends on a daemon-only package" >&2; exit 1
          fi
