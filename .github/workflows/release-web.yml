name: Web release

on:
  push:
    tags: ["web-v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Verify release provenance
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Build engine.wasm
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          mkdir -p extension/generated
          go build -trimpath -ldflags="-s -w" -o extension/generated/engine.wasm ./cmd/craig-wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" extension/generated/wasm_exec.js
      - name: Test and build extension
        working-directory: extension
        run: npm ci --ignore-scripts && npm test && npm run build
      - name: Check manifest version matches tag
        run: |
          tag="${GITHUB_REF_NAME#web-v}"
          manifest="$(node -p "require('./extension/manifest.json').version")"
          test "$tag" = "$manifest" || { echo "tag $tag != manifest $manifest" >&2; exit 1; }
      - name: Package
        working-directory: extension
        run: zip -r ../craig-web-package.zip manifest.json assets dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-package
          path: craig-web-package.zip
          retention-days: 1

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-package
          path: package
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" package/craig-web-package.zip --draft --verify-tag --title "Craig for Chrome ${GITHUB_REF_NAME#web-v}" --notes "Chrome Web Store package."
